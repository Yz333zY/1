<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张皓霖专用 · 接口簿</title>
<style>
/* ===== iOS 26 Liquid Glass 风格 ===== */
:root{
  --bg:#e8ecf2;                 /* 浅雾蓝底 */
  --glass:rgba(255,255,255,.45);/* 玻璃面板 */
  --glass2:rgba(255,255,255,.65);/* 亮玻璃 */
  --line:rgba(255,255,255,.75); /* 高光描边 */
  --line2:rgba(60,80,110,.12);  /* 内阴影描边 */
  --ink:#1b2230; --ink2:#5a6472; --ink3:#8a94a2;
  --shadow:0 10px 40px -10px rgba(40,60,90,.25);
  --radius:24px;
  --sans:-apple-system,"SF Pro Text","PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --mono:"SF Mono",ui-monospace,Consolas,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;
  /* 液态背景：丰富彩色渐变 + 大色块 */
  background:
    radial-gradient(900px 600px at 80% -10%,rgba(90,150,255,.55),transparent 60%),
    radial-gradient(700px 500px at -5% 20%,rgba(255,120,200,.5),transparent 55%),
    radial-gradient(800px 600px at 20% 110%,rgba(80,200,255,.5),transparent 60%),
    radial-gradient(600px 400px at 100% 60%,rgba(160,110,255,.45),transparent 55%),
    radial-gradient(500px 400px at 40% 40%,rgba(120,230,200,.35),transparent 60%),
    linear-gradient(160deg,#cfe0f5 0%,#e8ecf2 30%,#f0e6f2 65%,#dceef6 100%);
  background-attachment:fixed}
/* 液态玻璃装饰：漂浮光斑 */
.light{position:fixed;border-radius:50%;pointer-events:none;z-index:0;filter:blur(10px);opacity:.55}
.light.l1{width:300px;height:300px;top:-60px;right:-40px;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(150,190,255,.4) 55%,transparent 70%)}
.light.l2{width:260px;height:260px;bottom:8%;left:-50px;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,150,210,.4) 55%,transparent 70%)}
.light.l3{width:220px;height:220px;top:35%;left:55%;background:radial-gradient(circle,rgba(255,255,255,.8),rgba(120,210,255,.4) 55%,transparent 70%)}
/* 噪点颗粒 */
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 240 240' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.14'/%3E%3C/svg%3E")}
.wrap{max-width:1000px;margin:0 auto;padding:52px 20px 90px;position:relative;z-index:1}

/* 顶部玻璃条 */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:48px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-size:14.5px;font-weight:650;letter-spacing:.02em}
.brand .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#4a8dff,#a45cff);
  box-shadow:0 4px 14px -4px rgba(90,120,255,.6),inset 0 1px 1px rgba(255,255,255,.6)}
.meta{font-size:12px;color:var(--ink2);font-family:var(--mono)}

/* 玻璃统计卡 */
.stats{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--glass);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent)}
.stat b{font-size:24px;font-weight:700;display:block}
.stat span{font-size:11.5px;color:var(--ink2);font-family:var(--mono)}

/* 搜索框 */
.search{display:flex;gap:10px;margin-bottom:14px}
.search input{flex:1;padding:13px 18px;border:1px solid var(--line);border-radius:99px;background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:var(--ink);font-size:13.5px;font-family:var(--sans);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);outline:none;transition:.2s}
.search input::placeholder{color:var(--ink3)}
.search input:focus{border-color:rgba(74,141,255,.6);box-shadow:0 0 0 3px rgba(74,141,255,.15),var(--shadow)}
.search .shuffle{flex-shrink:0;border:1px solid var(--line);background:var(--glass);color:var(--ink);padding:13px 20px;
  border-radius:99px;font-size:13px;cursor:pointer;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.6);transition:.15s;font-family:var(--sans)}
.search .shuffle:hover{border-color:rgba(74,141,255,.6);box-shadow:0 0 0 3px rgba(74,141,255,.15),var(--shadow)}

/* 分类栏 */
.cats{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.cat{border:1px solid var(--line);background:var(--glass);color:var(--ink2);padding:8px 16px;border-radius:99px;
  font-size:12.5px;cursor:pointer;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:.15s;font-family:var(--sans)}
.cat:hover{color:var(--ink)}
.cat.active{background:rgba(74,141,255,.2);border-color:rgba(74,141,255,.5);color:var(--ink);font-weight:600}

/* 提示行 */
.hint{display:flex;align-items:center;gap:8px;margin:0 6px 14px;font-size:12.5px;color:var(--ink2)}

/* 玻璃卡片网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{display:block;text-decoration:none;color:inherit;background:var(--glass);
  border:1px solid var(--line);border-radius:var(--radius);padding:22px 22px 18px;
  backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.7);
  transition:transform .16s,box-shadow .2s;position:relative;overflow:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
/* 顶部高光弧线 */
.card::before{content:'';position:absolute;top:0;left:15%;right:15%;height:1.5px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.95),transparent)}
.card::after{content:'';position:absolute;top:-60%;left:-20%;width:60%;height:120%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);
  transform:rotate(8deg);transition:.45s;opacity:0}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 50px -14px rgba(40,60,90,.4),inset 0 1px 0 rgba(255,255,255,.8)}
.card:hover::after{opacity:1;left:60%}
.card:active{transform:scale(.98)}
.card .topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card .idx{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.card .st{font-size:10.5px;color:var(--ink2);font-family:var(--mono);background:rgba(255,255,255,.5);
  padding:3px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.6)}
.card h3{font-size:15.5px;font-weight:650;margin-bottom:4px;letter-spacing:-.01em}
.card p{font-size:12.5px;color:var(--ink2);line-height:1.55}
.card .foot{margin-top:14px;padding-top:12px;border-top:1px solid rgba(90,100,114,.14);
  display:flex;justify-content:space-between;align-items:center}
.card .src{font-size:11px;color:var(--ink3);font-family:var(--mono)}
.card .open{font-size:12px;font-weight:600;color:var(--ink)}

.footnote{margin-top:48px;text-align:center;font-size:12px;color:var(--ink3);font-family:var(--mono)}
.footnote a{color:var(--ink2);text-decoration:none}

@media(max-width:600px){
  .wrap{padding:32px 14px 60px}
  .grid{grid-template-columns:1fr 1fr}
  .card{padding:18px 16px 14px}
  .card p{font-size:12px}
}
@media(max-width:400px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<!-- 液态玻璃漂浮光斑 -->
<div class="light l1"></div>
<div class="light l2"></div>
<div class="light l3"></div>
<div class="wrap">
  <div class="topbar">
    <div class="brand"><span class="mark"></span>张皓霖专用 · 接口簿</div>
    <div class="meta" id="meta-count">33 接口 · 无密钥 · 直调</div>
  </div>

  <div class="stats">
    <div class="stat"><b id="s-api">25</b><span>接口</span></div>
    <div class="stat"><b id="s-ok">0</b><span>已用</span></div>
    <div class="stat"><b id="s-lat">—</b><span>最快响应</span></div>
  </div>

  <div class="hint">点击卡片查看数据 · 玻璃卡片整卡可点</div>

  <div class="search">
    <input type="text" id="search" placeholder="搜索接口… 例如：天气 / 翻译 / 狗">
    <button class="shuffle" id="shuffle">🎲 随便看看</button>
  </div>

  <div class="cats" id="cats">
    <button class="cat active" data-cat="">全部</button>
    <button class="cat" data-cat="图片">图片</button>
    <button class="cat" data-cat="文字">文字</button>
    <button class="cat" data-cat="数据">数据</button>
    <button class="cat" data-cat="太空">太空</button>
    <button class="cat" data-cat="工具">工具</button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="footnote">
    数据来自 <a href="https://github.com/public-apis/public-apis" target="_blank">public-apis</a>
  </div>
</div>

<script>
const APIS=[
  {id:'translate',name:'中文翻译',desc:'英→中翻译 · MyMemory',src:'mymemory.translated.net',cat:'工具'},
  {id:'weather',name:'实时天气',desc:'北京当前天气 · Open-Meteo',src:'open-meteo.com',cat:'数据'},
  {id:'hitokoto',name:'一言',desc:'随机中文句子',src:'hitokoto.cn',cat:'文字'},
  {id:'cat',name:'猫咪冷知识',desc:'随机猫咪知识',src:'catfact.ninja',cat:'文字'},
  {id:'dog',name:'随机狗图',desc:'随机狗狗照片',src:'dog.ceo',cat:'图片'},
  {id:'fox',name:'随机狐狸',desc:'随机狐狸照片',src:'randomfox.ca',cat:'图片'},
  {id:'joke',name:'随机笑话',desc:'安全模式笑话',src:'jokeapi.dev',cat:'文字'},
  {id:'kanye',name:'侃爷语录',desc:'随机 Kanye West 语录',src:'kanye.rest',cat:'文字'},
  {id:'advice',name:'人生建议',desc:'随机人生建议',src:'adviceslip.com',cat:'文字'},
  {id:'gender',name:'名字性别',desc:'预测名字性别',src:'genderize.io',cat:'数据'},
  {id:'age',name:'名字年龄',desc:'预测名字年龄段',src:'agify.io',cat:'数据'},
  {id:'ip',name:'我的 IP',desc:'定位当前出口 IP',src:'ipwho.is',cat:'数据'},
  {id:'user',name:'随机用户',desc:'生成虚构人物资料',src:'randomuser.me',cat:'数据'},
  {id:'fx',name:'实时汇率',desc:'美元兑主要货币',src:'er-api.com',cat:'数据'},
  {id:'pokemon',name:'宝可梦',desc:'皮卡丘资料',src:'pokeapi.co',cat:'数据'},
  {id:'sw',name:'星战人物',desc:'星战角色卢克',src:'swapi.dev',cat:'数据'},
  {id:'country',name:'世界国家',desc:'国家首都与人口',src:'restcountries.com',cat:'数据'},
  {id:'chuck',name:'Chuck 语录',desc:'随机硬汉语录',src:'chucknorris.io',cat:'文字'},
  {id:'dadjoke',name:'老爸笑话',desc:'随机冷笑话',src:'icanhazdadjoke.com',cat:'文字'},
  {id:'cocktail',name:'随机鸡尾酒',desc:'随机鸡尾酒配方',src:'cocktaildb.com',cat:'工具'},
  {id:'meal',name:'随机美食',desc:'随机菜谱',src:'themealdb.com',cat:'工具'},
  {id:'sunrise',name:'日出日落',desc:'北京日出日落时间',src:'sunrise-sunset.org',cat:'数据'},
  {id:'zip',name:'邮编查询',desc:'美国邮编信息',src:'zippopotam.us',cat:'工具'},
  {id:'zen',name:'GitHub 禅语',desc:'开发哲学短句',src:'github.com',cat:'文字'},
  {id:'picsum',name:'随机图片',desc:'Lorem Picsum 随机图片',src:'picsum.photos',cat:'图片'},
  {id:'duck',name:'随机鸭子',desc:'随机鸭子照片',src:'random-d.uk',cat:'图片'},
  {id:'iss',name:'空间站位置',desc:'国际空间站实时经纬度',src:'open-notify.org',cat:'太空'},
  {id:'astro',name:'太空宇航员',desc:'当前在轨宇航员名单',src:'open-notify.org',cat:'太空'},
  {id:'qrcode',name:'二维码生成',desc:'生成任意内容的二维码',src:'qrserver.com',cat:'工具'},
  {id:'avatar',name:'头像生成',desc:'DiceBear 随机头像',src:'dicebear.com',cat:'图片'},
  {id:'quote',name:'随机名言',desc:'DummyJSON 英文名言',src:'dummyjson.com',cat:'文字'},
  {id:'chess',name:'棋手资料',desc:'国际象棋棋手 Hikaru 资料',src:'chess.com',cat:'数据'}
];

const grid=document.getElementById('grid');
const sApi=document.getElementById('s-api');
sApi.textContent=APIS.length;
document.getElementById('meta-count').textContent=APIS.length+' 接口 · 无密钥 · 直调';

let curCat='', curKw='';

function render(){
  grid.innerHTML='';
  const kw=curKw.trim().toLowerCase();
  const list=APIS.filter(a=>
    (!curCat||a.cat===curCat) &&
    (!kw||a.name.toLowerCase().includes(kw)||a.desc.toLowerCase().includes(kw)||a.src.toLowerCase().includes(kw))
  );
  list.forEach((a,i)=>{
    const c=document.createElement('a');
    c.className='card';
    c.href='detail.html?id='+a.id;
    c.innerHTML=`
      <div class="topline">
        <span class="idx">${String(i+1).padStart(2,'0')}</span>
        <span class="st">${a.cat}</span>
      </div>
      <h3>${a.name}</h3>
      <p>${a.desc}</p>
      <div class="foot">
        <span class="src">${a.src}</span>
        <span class="open">查看 →</span>
      </div>`;
    grid.appendChild(c);
  });
  if(list.length===0) grid.innerHTML='<div class="hint" style="grid-column:1/-1;justify-content:center;padding:30px">没有匹配的接口</div>';
}

render();
document.getElementById('search').addEventListener('input',e=>{curKw=e.target.value;render()});

// 分类过滤
document.querySelectorAll('.cat').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    curCat=b.dataset.cat;
    render();
  });
});

// 随便看看：随机挑一个接口跳转
document.getElementById('shuffle').addEventListener('click',()=>{
  const pick=APIS[Math.floor(Math.random()*APIS.length)];
  location.href='detail.html?id='+pick.id;
});
</script>
</body>
</html>
